# ---------------------------------------------------------------------------
# MuscleMap backend - common configuration
# Profile-specific overrides live in application-dev.yml / application-prod.yml.
# Activate with SPRING_PROFILES_ACTIVE=dev|prod (defaults to dev below).
# ---------------------------------------------------------------------------
spring:
  application:
    name: musclemap-backend
  profiles:
    default: dev

  jpa:
    open-in-view: false
    hibernate:
      # Flyway is the single source of truth for the schema. Hibernate must
      # never alter it (no auto-ddl). This is a deliberate architectural choice.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Application metadata + versioned REST API base path
# (no magic strings scattered in controllers).
musclemap:
  app:
    name: MuscleMap
    version: 0.1.0
    milestone: "M1 - Backend Foundation"
  api:
    base-path: /api/v1
  cors:
    # Comma-separated allowed origins. Overridden per-environment.
    allowed-origins: http://localhost:5173,http://localhost:4173

# Actuator: expose health (+ info) for platform health checks (Render etc.).
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# OpenAPI / Swagger UI at /swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
