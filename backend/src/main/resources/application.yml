# ---------------------------------------------------------------------------
# MuscleMap backend - common configuration
# Profile-specific overrides live in application-dev.yml / application-prod.yml.
# Activate with SPRING_PROFILES_ACTIVE=dev|prod (defaults to dev below).
# ---------------------------------------------------------------------------
spring:
  application:
    name: musclemap-backend
  profiles:
    default: dev

  jpa:
    open-in-view: false
    hibernate:
      # Flyway is the single source of truth for the schema. Hibernate must
      # never alter it (no auto-ddl). This is a deliberate architectural choice.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Application metadata + versioned REST API base path
# (no magic strings scattered in controllers).
musclemap:
  app:
    name: MuscleMap
    version: 0.6.0
    milestone: "EM12 - Product Polish"
  admin:
    # Role bootstrap (EM9): comma-separated emails granted a role automatically,
    # both on startup AND on first sign-in (no restart needed). Never demotes.
    # Admin defaults to the platform owner so there is always a way in.
    bootstrap-emails: ${MUSCLEMAP_ADMIN_EMAILS:omarmnif123@gmail.com}
    # Designated coach emails -> COACH on sign-in (e.g. the brother's account).
    bootstrap-coach-emails: ${MUSCLEMAP_COACH_EMAILS:}
  api:
    base-path: /api/v1
  catalog:
    # Media URLs used when seeding the catalogue (mirrors the frontend config).
    # Exercise images live on the upstream free-exercise-db CDN; YouTube
    # thumbnails are derived from the curated video ids.
    image-base-url: https://cdn.jsdelivr.net/gh/yuhonas/free-exercise-db@main/exercises/
    youtube-thumbnail-base-url: https://img.youtube.com/vi/
    youtube-thumbnail-suffix: /hqdefault.jpg
  cors:
    # Comma-separated allowed origins. Overridden per-environment.
    allowed-origins: http://localhost:5173,http://localhost:4173
  security:
    jwt:
      # HS256 signing secret (>= 32 bytes). No default here: prod must supply
      # MUSCLEMAP_JWT_SECRET or the app refuses to start. dev sets one locally.
      secret: ${MUSCLEMAP_JWT_SECRET:}
      ttl-seconds: ${MUSCLEMAP_JWT_TTL_SECONDS:86400}
      issuer: musclemap
  oauth:
    google:
      # Same Google client id the frontend uses (the token audience we validate).
      # When blank, /auth/google returns 503 and email/password auth still works.
      client-id: ${MUSCLEMAP_GOOGLE_CLIENT_ID:}

# Actuator: expose health (+ info) for platform health checks (Render etc.).
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# OpenAPI / Swagger UI at /swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
