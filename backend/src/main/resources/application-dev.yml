# ---------------------------------------------------------------------------
# Local development profile.
# Spin up PostgreSQL with: docker compose up -d  (see backend/docker-compose.yml)
# ---------------------------------------------------------------------------
spring:
  datasource:
    # Host port 5433 maps to the docker-compose Postgres (avoids clashing with a
    # locally-installed Postgres on 5432). Override via SPRING_DATASOURCE_URL.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/musclemap}
    username: ${SPRING_DATASOURCE_USERNAME:musclemap}
    password: ${SPRING_DATASOURCE_PASSWORD:musclemap}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.musclemap: DEBUG
    org.flywaydb: INFO
