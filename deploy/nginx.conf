# ---------------------------------------------------------------------------
# Configuration Nginx pour la VM : UN seul domaine sert le frontend ET le backend.
#
#   /            -> les fichiers statiques du frontend  (frontend/dist copié dans
#                   /var/www/musclemap), avec repli SPA sur index.html.
#   /api/...     -> proxy vers le backend Spring Boot (127.0.0.1:8080).
#
# Comme tout est sur la MÊME origine, le navigateur ne fait pas de requête CORS.
#
# Installation sur la VM (Ubuntu) :
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/musclemap
#   sudo ln -s /etc/nginx/sites-available/musclemap /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT : remplacer "musclemap.exemple.com" par TON domaine réel partout.
# Les blocs HTTPS (443) ci-dessous sont ajoutés/complétés automatiquement par
# Certbot (Let's Encrypt) — voir DEPLOY_AZURE.md. Tu peux démarrer avec le seul
# bloc port 80, lancer certbot, et il génère le 443 pour toi.
# ---------------------------------------------------------------------------

# --- HTTP (port 80) : sert le challenge Certbot, puis redirige tout vers HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name musclemap.exemple.com;

    # Laisser Certbot écrire/valider son challenge ACME ici.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste -> HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (port 443) : le vrai service ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name musclemap.exemple.com;

    # Certificats gérés par Certbot (chemins typiques Let's Encrypt) :
    ssl_certificate     /etc/letsencrypt/live/musclemap.exemple.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musclemap.exemple.com/privkey.pem;

    # Racine = build statique du frontend.
    root /var/www/musclemap;
    index index.html;

    # Taille max d'un corps de requête (uploads éventuels).
    client_max_body_size 10m;

    # --- API -> backend Spring Boot (le backend garde son préfixe /api/v1) ---
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Swagger / actuator (optionnel : pratique pour démontrer l'API) ---
    location ~ ^/(swagger-ui|v3/api-docs|actuator)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Frontend : fichiers statiques + repli SPA ---
    # Si le fichier n'existe pas (ex. /exercises, /map), on renvoie index.html
    # pour que le routeur React (côté client) prenne le relais.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets fingerprintés (Vite ajoute un hash au nom).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
