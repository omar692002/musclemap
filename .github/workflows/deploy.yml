# Builds the PWA and deploys it to GitHub Pages on every push to master.
# The frontend lives in the `frontend/` folder of the monorepo (backend is in
# `backend/`). The app is served under /<repo>/, so the build gets BASE_PATH
# (see frontend/vite.config.ts), and 404.html mirrors index.html so deep links
# work with the SPA router.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Google OAuth client id (public). Set as a repository *variable* to
          # enable sign-in on the deployed app; empty hides all auth UI.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # Backend base URL (e.g. https://musclemap-api.onrender.com/api/v1).
          # Set as a repository variable to enable email/password sign-in and
          # backend-synced data; empty keeps the app fully client-side.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
